name: npm-publish
on:
    release:
        types: [published]
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "26.x"
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - name: Verify
              run: |
                  CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome)"
                  CHROMEDRIVER_BIN="$(command -v chromedriver)"
                  FIREFOX_BIN="$(command -v firefox)"
                  "$CHROME_BIN" --version
                  "$CHROMEDRIVER_BIN" --version
                  "$FIREFOX_BIN" --version
                  export CHROME_BIN CHROMEDRIVER_BIN FIREFOX_BIN
                  npm run verify
            - run: npm publish --provenance --access public
