name: CI
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-22.04
        strategy:
            matrix:
                node: [24]
        name: Node ${{ matrix.node }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - name: Install dependencies
              run: npm ci
            - name: Cache test browsers
              uses: actions/cache@v4
              with:
                  path: .wdio-cache
                  key: wdio-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: wdio-browsers-${{ runner.os }}-
            - name: Install test browsers
              run: npx @puppeteer/browsers install chrome@stable chromedriver@stable --path .wdio-cache
            - name: Lint
              run: npm run lint
            - name: Run tests
              run: npm test
