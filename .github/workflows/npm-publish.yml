name: npm-publish
on:
    release:
        types: [published]
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  registry-url: "https://registry.npmjs.org"
            - run: npm ci
            - name: Verify
              run: |
                  export CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome)"
                  export CHROMEDRIVER_BIN="$(command -v chromedriver)"
                  export FIREFOX_BIN="$(command -v firefox)"
                  npm run verify
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
